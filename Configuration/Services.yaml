services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  W3code\W3cAIConnector\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  W3code\W3cAIConnector\Service\SolrService:
    public: true
    shared: false

  W3code\W3cAIConnector\Service\BedrockKnowledgeBaseService:
    public: true

  W3code\W3cAIConnector\EventListener\IndexSolrDocumentsInBedrockKnowledgeBase:
    tags:
      - name: event.listener
        identifier: 'w3c-aiconnector/index-solr-documents-in-bedrock-knowledge-base'
